services:
  - type: web
    name: lifelink-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: lifelink-db
          property: connectionString
      - key: JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: 24eg107f49@anurag.edu.in
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: lifelink-db
    databaseName: lifelink
    user: lifelink
    plan: free
    region: oregon