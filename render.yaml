services:
  - type: web
    name: lifelink-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/blood-donor-api/Dockerfile
    dockerContext: ./backend/blood-donor-api
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false